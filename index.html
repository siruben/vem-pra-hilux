function tone(f,t0,d,type,v,dest,f2){const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(dest);o.start(t0);o.stop(t0+d+.03)}

function kick(t,d){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(.8,t);g.gain.exponentialRampToValueAtTime(.0001,t+.2);o.connect(g);g.connect(d);o.start(t);o.stop(t+.22)}

 pop(){const t=AC.currentTime;tone(740,t,.08,'sine',.3,sfxG);tone(988,t+.09,.12,'sine',.3,sfxG)},
 send(){tone(520,AC.currentTime,.08,'sine',.25,sfxG,720)},

function mstep(s,t){const ch=CH[(s>>3)%4],i=s&7;

 tone(ch[ARP[i]]*2,t,.16,'triangle',.35,musG);

const hhmm=()=>{const h=Math.floor(clock/60)%24,m=clock%60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')};

const fmt=s=>{s=Math.max(0,Math.round(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function voiceBubble(file,text,out){
  const bars=Array.from({length:26},()=>`<i style="height:${ri(5,22)}px"></i>`).join('');
  const e=add(`<div class="b"><div class="voice"><button class="pl hint">▶</button><div class="wave">${bars}</div><span class="du">0:00</span></div><div class="tr" hidden>🎙️ ${text}</div><span class="tm">${hhmm()}${out?'<span class="tk">✓</span>':''}</span></div>`,out?'out':'in');
  const a=new Audio(VOZ[file]);a.preload='auto';
  const pl=e.querySelector('.pl'),du=e.querySelector('.du'),tr=e.querySelector('.tr'),w=[...e.querySelectorAll('.wave i')];
  const reveal=()=>{tr.hidden=false;scroll()};
  let finish;const done=new Promise(r=>{finish=r});
  a.onloadedmetadata=()=>{du.textContent=fmt(a.duration)};
  a.ontimeupdate=()=>{const p=a.currentTime/(a.duration||1);w.forEach((b,i)=>b.classList.toggle('on',i/w.length<p));du.textContent=fmt(a.duration-a.currentTime)};
  a.onplay=()=>{pl.classList.remove('hint');pl.textContent='⏸';duck(true);reveal()};
  a.onpause=()=>{if(!a.ended){pl.textContent='▶';if(curVoice===a)duck(false)}};
  a.onerror=()=>{pl.textContent='▶';if(curVoice===a){curVoice=null;duck(false)}finish()};
  a.onended=()=>{pl.textContent='▶';if(curVoice===a){curVoice=null;duck(false)}du.textContent=fmt(a.duration);w.forEach(b=>b.classList.remove('on'));finish()};
  pl.onclick=()=>{if(a.paused){if(curVoice&&curVoice!==a)curVoice.pause();curVoice=a;a.play().catch(()=>{sys('🔇 Som bloqueado neste visor. Abre o jogo no Chrome.');reveal();setTimeout(finish,3000)})}else a.pause()};
  return {e,a,done}}
async function inVoice(file,text){

  fake.hidden=true;
  choices.innerHTML=opts.map((o,i)=>`<button data-i="${i}"><small>${o.tag}</small>${o.say}</button>`).join('');
  choices.querySelectorAll('button').forEach(b=>b.onclick=()=>{sfx('tick');choices.innerHTML='';fake.hidden=false;res(+b.dataset.i)});
  scroll()})}
function notify(k,txt){return new Promise(res=>{
  const t=$('#toast');t.innerHTML=`<small>💬 Nova mensagem de</small><b>${CT[k].n}</b><span>${txt}</span><em>Toca para abrir</em>`;
  t.hidden=false;t.className='tap';sfx('notif');try{navigator.vibrate&&navigator.vibrate([120,60,120])}catch(e){}
  t.onclick=()=>{t.hidden=true;t.onclick=null;res()}})}
function setHdr(k){const f=document.createDocumentFragment();while(chat.firstChild)f.appendChild(chat.firstChild);store[cur]=f;cur=k;if(store[k])chat.appendChild(store[k]);hname.textContent=CT[k].n;setAv(k);hsub.textContent='online';scroll()}

/* rondas de conversa */
async function round(opts){
  const i=await choose(opts),o=opts[i];await outMsg(o.say);let d,rep;
  if(o.t==='bold'){const ok=Math.random()<.5+charm/400;d=ok?12:-12;rep=ok?o.win:o.lose}
  else if(o.t==='fool'){d=ri(4,8)+(laugh?4:0);rep=o.ok}
  else{const good=charm>=30;d=good?10:3;rep=good?o.good:o.weak}
  setCharm(d);chip(d);await sleep(1000);for(const m of rep)await inMsg(m)}

function openSheet(html){sh.classList.remove('cover');sh.innerHTML=`<div class="sc">${html}</div>`;sh.hidden=false;sh.scrollTop=0;return sh.firstChild}
function closeSheet(){sh.hidden=true;sh.classList.remove('cover');sh.innerHTML=''}
function doneBtn(sc,gain){sc.insertAdjacentHTML('beforeend',`<div class="gain">❤️ +${gain} charme</div><button class="bt" id="ct">Voltar ao chat ➜</button>`);
  return new Promise(r=>$('#ct').onclick=()=>{closeSheet();setCharm(gain);r(gain)})}

function actDance(){return new Promise(res=>{
  const sc=openSheet(`<h2 class="neon">💃 Dança no arraial</h2><p>A Célia desafiou-te! Pára o marcador na zona verde. 3 tentativas, e a música acelera.</p><div class="bar2"><div class="zone"></div><div class="mk" id="mk"></div></div><div class="m2" id="m2">Tentativa 1 de 3</div><button class="bt" id="stop">PÁRA!</button>`);
  let tries=0,gain=0,pos=0,dir=1,speed=.9,raf,done=false,last=performance.now();const mk=$('#mk');
  const loop=t=>{const dt=Math.min((t-last)/1000,.05);last=t;pos+=dir*speed*dt;if(pos>=1){pos=1;dir=-1}if(pos<=0){pos=0;dir=1}mk.style.left=pos*100+'%';raf=requestAnimationFrame(loop)};
  raf=requestAnimationFrame(loop);
  $('#stop').onclick=()=>{if(done)return;const s=Math.max(0,1-Math.abs(pos-.5)/.5),g=Math.round(s*s*4);gain+=g;tries++;speed+=.3;
    sfx(g>=3?'good':g>=1?'tick':'bad');
    $('#m2').textContent=(g>=3?'Passo perfeito! 🔥':g>=1?'Nada mau!':'Pisaste-lhe o pé! 😅')+' (+'+g+')';
    if(tries>=3){done=true;cancelAnimationFrame(raf);$('#stop').remove();setTimeout(()=>doneBtn(sc,gain).then(res),700)}
    else setTimeout(()=>{$('#m2').textContent='Tentativa '+(tries+1)+' de 3'},900)};
})}

function actDodge(level){return new Promise(res=>{
  const sc=openSheet(`<h2 class="neon">🐂 Desvia dos touros!</h2><p>O Zé soltou a boiada! Aguenta 15 segundos. Toca no lado esquerdo/direito do ecrã ou usa os botões.</p><canvas id="cv" width="320" height="340"></canvas><div class="row"><button class="bt sm" id="L">◀</button><button class="bt sm" id="R">▶</button></div><div class="m2" id="m2">A correr…</div>`);
  const cv=$('#cv'),c=cv.getContext('2d'),lx=[53,160,267],spd=[150,185,230][level],gap=[.65,.52,.42][level];
  let lane=1,hits=0,time=15,obs=[],spawn=.3,last=performance.now(),run=true,off=0,shake=0;
  const mv=d=>{lane=Math.max(0,Math.min(2,lane+d))};
  $('#L').onclick=()=>mv(-1);$('#R').onclick=()=>mv(1);
  cv.onclick=e=>{const r=cv.getBoundingClientRect();mv(e.clientX-r.left<r.width/2?-1:1)};
  const key=e=>{if(e.key==='ArrowLeft')mv(-1);if(e.key==='ArrowRight')mv(1)};addEventListener('keydown',key);
  const loop=t=>{if(!run)return;const dt=Math.min((t-last)/1000,.05);last=t;time-=dt;spawn-=dt;off=(off+spd*dt)%40;
    if(spawn<=0){const a=Math.floor(Math.random()*3);obs.push({l:a,y:-30});if(Math.random()<[.3,.45,.6][level])obs.push({l:(a+1+Math.floor(Math.random()*2))%3,y:-30});spawn=gap*rnd(.75,1.25)}
    obs.forEach(o=>{o.y+=spd*dt;if(!o.h&&o.l===lane&&o.y>265&&o.y<330){o.h=1;hits++;shake=.25;sfx('hit')}});
    obs=obs.filter(o=>o.y<380);
    c.save();if(shake>0){c.translate(rnd(-4,4),rnd(-4,4));shake-=dt}
    c.fillStyle='#1b1b24';c.fillRect(0,0,320,340);
    c.strokeStyle='#ffffff44';c.lineWidth=3;c.setLineDash([18,22]);c.lineDashOffset=-off;
    [107,213].forEach(x=>{c.beginPath();c.moveTo(x,0);c.lineTo(x,340);c.stroke()});c.setLineDash([]);
    c.textAlign='center';c.textBaseline='middle';c.font='34px serif';
    obs.forEach(o=>{c.globalAlpha=o.h?.35:1;c.fillText('🐂',lx[o.l],o.y)});c.globalAlpha=1;
    c.fillText('🛻',lx[lane],300);
    c.font='bold 16px sans-serif';c.fillStyle='#fff';c.textAlign='left';c.fillText('⏱ '+Math.max(0,time).toFixed(1)+'s',8,16);c.textAlign='right';c.fillText('💥 '+hits,312,16);
    c.restore();
    if(time<=0){run=false;removeEventListener('keydown',key);
      const g=Math.max(0,10-hits*2)+(level===2&&hits<=2?3:0);
      $('#m2').textContent=hits===0?'Intocável! 🛻💨':hits<4?'Escapaste por pouco!':'Foste pisoteado 🥴';sfx(hits<4?'win':'lose');
      setTimeout(()=>doneBtn(sc,g).then(v=>res({g:v,hits})),800);return}
    requestAnimationFrame(loop)};
  requestAnimationFrame(loop);
})}

function actRhythm(){return new Promise(res=>{
  const P=[{e:'🎸',f:'viola'},{e:'🥁',f:'zab'},{e:'🚗',f:'horn'}];
  const sc=openSheet(`<h2 class="neon">🎸 Toca a nossa moda</h2><p>Ouve e repete a sequência: viola, zabumba e buzina. 3 rondas e uma segunda chance.</p><div class="pads">${P.map((p,i)=>`<button class="pad" data-i="${i}">${p.e}</button>`).join('')}</div><div class="m2" id="m2"></div>`);
  const pads=[...sc.querySelectorAll('.pad')];let round=0,seq=[],inp=[],gain=0,life=1,lock=true;
  const hit=i=>{pads[i].classList.add('on');sfx(P[i].f);setTimeout(()=>pads[i].classList.remove('on'),220)};
  const newSeq=()=>{seq=Array.from({length:3+round},()=>Math.floor(Math.random()*3))};
  const show=async()=>{lock=true;inp=[];$('#m2').textContent='Ouve… 👂';await sleep(700);for(const i of seq){hit(i);await sleep(560)}lock=false;$('#m2').textContent='A tua vez! 👆'};
  const end=()=>{lock=true;$('#m2').textContent=gain>=12?'Afinadíssimo! 🎶':gain>=4?'Dá pro gasto!':'Desafinaste… 😬';sfx(gain>=4?'win':'lose');setTimeout(()=>doneBtn(sc,gain).then(res),800)};
  pads.forEach((b,i)=>b.onclick=()=>{if(lock)return;hit(i);inp.push(i);const k=inp.length-1;
    if(inp[k]!==seq[k]){lock=true;if(life>0){life--;$('#m2').textContent='Errou! Mais uma chance…';sfx('bad');setTimeout(show,900)}else end();return}
    if(inp.length===seq.length){gain+=4;round++;lock=true;sfx('good');
      if(round>=3)setTimeout(end,500);else{$('#m2').textContent='Boa! Próxima ronda…';setTimeout(()=>{newSeq();show()},900)}}});
  newSeq();show();
})}

function actRev(){return new Promise(res=>{
  const sc=openSheet(`<h2 class="neon">🔥 Ronca o motor</h2><p>Toca o mais depressa que conseguires durante 5 segundos. A Célia está a ouvir!</p><div class="meter"><div id="tf"></div></div><div class="m2" id="m2">Toca para começar</div><button class="bt" id="tb">🔥 ACELERA!</button>`);
  let n=0,left=5,iv=null,over=false;
  $('#tb').onclick=()=>{if(over)return;n++;sfx('rev',Math.min(n,40));$('#tf').style.width=Math.min(n/38,1)*100+'%';
    if(!iv)iv=setInterval(()=>{left=Math.max(0,left-.1);$('#m2').textContent=left.toFixed(1)+'s · '+n+' toques';
      if(left<=0){clearInterval(iv);over=true;const g=Math.round(Math.min(n/38,1)*8);$('#tb').remove();
        $('#m2').textContent=(g>=7?'A freguesia acordou! 🔊':g>=4?'Ronca decente.':'Isso foi um espirro, não um motor.')+' ('+n+' toques)';
        setTimeout(()=>doneBtn(sc,g).then(res),600)}},100)};
})}

    e={emoji:'🔥🚙',title:'Ela sobe!',txt:"A Célia abre a porta, ajeita o chapéu e avisa: «Só até o fim da estrada, tá? Depois a gente vê.» O rádio toca alto e a Hilux some na poeira, com a festa toda a assobiar."};
  }else if(charm>=50){
    await inMsg("Boleia até o portão, combinado? 🌙");await inMsg("Amanhã eu apareço no rodeio. Melhora o repertório 😘");
    e={emoji:'😏🌙',title:'Boleia até casa',txt:"A Célia aceita a carona, mas só até ao portão. Despede-se com um sorriso cúmplice e uma promessa que fica no ar."};
  }else if(charm>=30){
    await inMsg("Me manda o teu número… de amigo do bolo 🍰");await inMsg("Boa noite, Rubinho 😴");
    e={emoji:'🍰🤝',title:'Amigo do bolo',txt:"A Célia guarda o teu número, mas na secção «amigos». Aprendeste a lição: pressa e perfume de feira não compram corações."};
  }else{
    await inMsg("Minha amiga chegou, vou nessa. Tchau, Rubinho 👋");sys('Célia ficou offline');
    e={emoji:'🥶🍖',title:'Tampa épica',txt:"A Célia ri, balança a cabeça e entra no carro da Neide. O Rubinho fica sozinho com a Hilux e o churrasco já frio. Dizem que ainda está lá a ensaiar frases."};
  }
  sfx(charm>=50?'win':'lose');await sleep(900);endSheet(e);
}

/* ===== música: fundo + original ===== */
let song=null;
try{aud.src=MUS.bg;song=new Audio(MUS.song);song.preload='none'}catch(e){}
const sgBtn=t=>{const b=$('#sg');if(b)b.textContent=t};
function stopSong(){if(!song)return;song.pause();try{song.currentTime=0}catch(e){}sgBtn('🎵 Ouvir a música original')}
function startSong(){if(!song)return;aud.pause();synthStop();song.volume=.9;song.play().then(()=>sgBtn('⏸ Pausar a música original')).catch(()=>sgBtn('🔇 Som bloqueado neste visor'))}
function toggleSong(){if(song&&!song.paused){song.pause();sgBtn('▶ Continuar a música original');if(musOn)musicStart()}else startSong()}
if(song)song.onended=()=>{stopSong();if(musOn)musicStart()};
