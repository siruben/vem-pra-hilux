name: Smoke tests
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate syntax and essential files
        run: node scripts/smoke-test.mjs
